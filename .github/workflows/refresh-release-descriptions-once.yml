name: One-shot refresh release descriptions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify target releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          for tag in v1.0 v1.1 v1.2 v2.0 v2.1 v2.2; do
            gh release view "$tag" >/dev/null
          done

      - name: Prepare descriptions
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v1.0.md <<'EOF'
          # v1.0 - Основа регулятора

          Первый рабочий релиз `openai-work-codex-regulator`. Здесь появилась базовая схема, на которой строятся все следующие версии: Chat отвечает за оркестрацию, Work берёт браузерные и многошаговые задачи, Codex работает с кодом и технической средой.

          > Архивная версия. Для новой установки используйте [v2.2](https://github.com/misyukdima/openai-work-codex-regulator/releases/tag/v2.2).

          ## Что появилось

          - маршрутизация между Chat, Work и Codex;
          - единая логика shared agentic pool для Work/Codex;
          - quota snapshot перед тяжёлыми проходами;
          - project runway и дисциплина одного gate на один substantive pass;
          - классы риска `0-4`;
          - базовые правила для Work/browser и Codex;
          - recovery после неудачных попыток;
          - карта официальных OpenAI-источников.

          ## Зачем был нужен v1.0

          До этой версии не было общего контракта, который связывал выбор surface, расход квоты, риск задачи и проверку результата. `v1.0` зафиксировал этот каркас и сделал дальнейшие изменения проверяемыми, а не набором разрозненных промптов.

          ## Установка

          Скачайте артефакт нужной версии в блоке **Assets** ниже и используйте `SKILL.md` как entry point.
          EOF

          cat > /tmp/v1.1.md <<'EOF'
          # v1.1 - Квота и безопасность

          `v1.1` усилила первую версию там, где реальные агентские задачи чаще всего теряют квоту или выходят за ожидаемые границы: routing, browser actions, connected apps, prompt injection и release-процесс.

          > Архивная версия. Для новой установки используйте [v2.2](https://github.com/misyukdima/openai-work-codex-regulator/releases/tag/v2.2).

          ## Главное

          - `CHAT_BOUNDED_WEB` для задач, которым не нужен полноценный agentic pass;
          - обязательные `WHY_AGENTIC` и `VALUE_OUTPUT` перед передачей работы в Work/Codex;
          - явный `USER_SURFACE_OVERRIDE=YES`, если пользователь сознательно выбирает более дорогую surface;
          - защита от prompt injection в страницах, письмах и документах;
          - проверка активного аккаунта перед внешними действиями;
          - правило `Downloading ≠ permission to execute`;
          - более точная атрибуция shared-pool расхода;
          - отдельная проверка paid-credit eligibility;
          - hardening Scheduled Tasks;
          - автоматическая валидация репозитория и release-процесса.

          ## Что изменилось на практике

          Регулятор стал чаще оставлять простые задачи в Chat и перестал считать Work/Codex универсальным ответом на любой запрос. Одновременно появились жёсткие границы для действий во внешних аккаунтах и для недоверенного контента.

          ## Проверка

          В релиз вошли regression tests `37-50`, которые закрепили новые routing и safety-инварианты.
          EOF

          cat > /tmp/v1.2.md <<'EOF'
          # v1.2 - Маршрутизация моделей

          `v1.2` добавила отдельный model router. Регулятор начал выбирать не конкретное поколение модели, а устойчивый capability tier под задачу и расход квоты.

          > Архивная версия. Для новой установки используйте [v2.2](https://github.com/misyukdima/openai-work-codex-regulator/releases/tag/v2.2).

          ## Что появилось

          - `Luna` для рутинной и массовой работы;
          - `Terra` как сбалансированный default;
          - `Sol` для сложного и consequential synthesis;
          - нормализованные поля model availability, tier, effort и fallback;
          - отдельные условия для максимального reasoning effort;
          - staged pipeline, где разные этапы могут использовать разные tiers;
          - защита от жёсткой привязки core-логики к конкретному GPT generation ID.

          ## Почему это важно

          До `v1.2` surface routing уже экономил agentic usage, но модель внутри выбранной surface могла оставаться слишком дорогой или, наоборот, недостаточной. Эта версия добавила второй слой маршрутизации: сначала выбирается место выполнения, затем минимально достаточный capability tier.

          ## Проверка

          Regression tests `51-60` покрывают high-volume extraction, обычный research, consequential synthesis, effort escalation и смену поколений моделей.
          EOF

          cat > /tmp/v2.0.md <<'EOF'
          # v2.0 - Архитектура Astra

          `v2.0` перестроила model architecture после появления GPT-6 Astra. Astra не стала четвёртым tier рядом с Luna, Terra и Sol. Для неё введён отдельный `MODEL_PROFILE=ASTRA` с собственным admission contract.

          > Архивная версия. Для новой установки используйте [v2.2](https://github.com/misyukdima/openai-work-codex-regulator/releases/tag/v2.2).

          ## Главное

          - два измерения model routing: `MODEL_PROFILE` и `MODEL_TIER`;
          - `ASTRA_JUSTIFIED=YES` только для задач, где end-to-end capability действительно даёт преимущество;
          - разделение `WORK_CODEX`, `CHAT_PRO` и `API` allowance domains;
          - Codex client readiness для Astra;
          - отдельные правила для Fast и максимального reasoning effort;
          - mid-turn steering с повторным admission при расширении scope;
          - `SAFETY_STATE=PAUSED_FOR_REVIEW` без обхода через другую surface или модель;
          - усиленная target authorization для cyber-sensitive class 4;
          - long-context discipline и compact handoff как default.

          ## Что поменялось в логике

          Сильнейшая доступная модель перестала считаться автоматическим выбором для важной задачи. Регулятор сначала проверяет, закрывает ли Terra/Sol gate с нужным качеством, и только потом допускает Astra по конкретной причине.

          ## Проверка

          В `v2.0` набор вырос до 75 regression tests. Новые сценарии покрывают Astra admission, allowance separation, client readiness, steering, safety pause, cyber authorization и long context.
          EOF

          cat > /tmp/v2.1.md <<'EOF'
          # v2.1 - Адаптивный недельный контроллер

          `v2.1` впервые превратила недельную Work/Codex-квоту в отдельный feedback controller. Вместо приблизительного бюджета на pass регулятор начал опираться на реальный weekly meter, reset time и наблюдаемый burn.

          > Архивная версия. В `v2.2` исправлен главный недостаток этого контроллера: 24-часовой slice больше не служит жёсткой границей запуска.

          ## Что появилось

          - `QUOTA_EPOCH_ID` и полный re-anchor после reset или изменения allowance;
          - фиксированный 24h `CONTROL_SLICE_BUDGET_PP`;
          - ранний reserve до 10 percentage points с ограничением в 50% текущего остатка;
          - постепенный release reserve в последние 72 часа;
          - `SLICE_SPENT_PP` и реальный headroom вместо нового "дневного бюджета" после каждого pass;
          - conservative `B_SAFE` по сопоставимой истории burn;
          - отдельный 5-hour circuit breaker;
          - `PENDING_BURN` для lagged telemetry;
          - резервирование будущего расхода Scheduled Tasks;
          - `QUALITY_FLOOR=NON_NEGOTIABLE`;
          - reference calculator `scripts/weekly_quota_controller.py`.

          ## Что показали полевые тесты

          Контроллер хорошо защищал неделю от front-loading, но слишком сильно предпочитал сохранение квоты. Если качественный pass не помещался в текущий 24h slice, система могла отложить critical-path работу на сутки. Именно этот результат стал причиной `v2.2`.

          ## Проверка

          В релизе 95 regression tests. Сценарии `76-95` проверяют daily envelope, reserve release, quota epochs, burn estimation, 5h separation, pending telemetry и scheduled reservations.
          EOF

          cat > /tmp/v2.2.md <<'EOF'
          # v2.2 - Баланс квоты и рабочего темпа

          Текущая версия регулятора. `v2.2` появилась после реального теста `v2.1`, где система сохранила недельную квоту, но ценой 24-часовой остановки рабочего процесса. Теперь сохранение allowance и движение critical path имеют одинаковый приоритет после hard safety и quality gates.

          ## Что изменилось

          - fixed 24h slice больше не используется как hard admission cap;
          - недельный план строится как одна epoch-anchored cumulative trajectory;
          - 24 часа остались normal look-ahead, а для важного pass доступен bounded future advance до 72 часов траектории;
          - решение сравнивает `QUOTA_RISK_IF_LAUNCH` и `PACE_RISK_IF_DEFER`;
          - добавлен `QUOTA_DECISION=LAUNCH_WITH_ADVANCE`;
          - при равном риске нет скрытого преимущества у экономии квоты;
          - `QUALITY_FLOOR`, permissions, 5h limits и safety остаются hard constraints;
          - перед чистым defer регулятор ищет meaningful progress в Chat или другом уже разрешённом пути.

          ## Исправлен Chat -> Codex / Work handoff

          В `v2.2` control plane отделён от execution plane:

          ```text
          HANDOFF_SELF_CONTAINED=YES
          EXECUTOR_SKILL_REQUIRED=NO
          ```

          Если skill работает в Chat, downstream Codex или Work не обязаны иметь его у себя. Chat принимает quota/model/admission-решение и передаёт готовый execution packet: цель, fact pack, scope, tests, rollback и stop conditions. Внутренняя quota math в executor prompt не утекает.

          ## Почему это лучше

          Регулятор больше не оптимизирует одну метрику за счёт другой. Он защищает недельную квоту, но не превращает её сохранение в самоцель. Critical-path работа может продолжиться раньше, если риск запуска не выше риска ожидания и pass остаётся внутри bounded advance.

          ## Проверка

          `v2.2` содержит **115 regression tests**. Сценарии `96-115` отдельно проверяют executor independence, отсутствие control-plane leakage, cumulative trajectory, bounded advance, equal-risk decisions, 5h protection, pending telemetry и productive alternatives.

          ## Установка

          Скачайте `openai-work-codex-regulator-v2.2.zip` из блока **Assets** ниже. Рядом опубликован SHA-256 checksum для проверки архива. Entry point: `SKILL.md`.
          EOF

      - name: Update release pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v1.0 --title "v1.0 - Основа регулятора" --notes-file /tmp/v1.0.md
          gh release edit v1.1 --title "v1.1 - Квота и безопасность" --notes-file /tmp/v1.1.md
          gh release edit v1.2 --title "v1.2 - Маршрутизация моделей" --notes-file /tmp/v1.2.md
          gh release edit v2.0 --title "v2.0 - Архитектура Astra" --notes-file /tmp/v2.0.md
          gh release edit v2.1 --title "v2.1 - Адаптивный недельный контроллер" --notes-file /tmp/v2.1.md
          gh release edit v2.2 --title "v2.2 - Баланс квоты и рабочего темпа" --notes-file /tmp/v2.2.md

      - name: Verify descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v1.0 --json name --jq .name)" = "v1.0 - Основа регулятора"
          test "$(gh release view v1.1 --json name --jq .name)" = "v1.1 - Квота и безопасность"
          test "$(gh release view v1.2 --json name --jq .name)" = "v1.2 - Маршрутизация моделей"
          test "$(gh release view v2.0 --json name --jq .name)" = "v2.0 - Архитектура Astra"
          test "$(gh release view v2.1 --json name --jq .name)" = "v2.1 - Адаптивный недельный контроллер"
          test "$(gh release view v2.2 --json name --jq .name)" = "v2.2 - Баланс квоты и рабочего темпа"

          gh release view v1.0 --json body --jq .body | grep -Fq "## Что появилось"
          gh release view v1.1 --json body --jq .body | grep -Fq "## Главное"
          gh release view v1.2 --json body --jq .body | grep -Fq "## Почему это важно"
          gh release view v2.0 --json body --jq .body | grep -Fq "## Что поменялось в логике"
          gh release view v2.1 --json body --jq .body | grep -Fq "## Что показали полевые тесты"
          gh release view v2.2 --json body --jq .body | grep -Fq "## Исправлен Chat -> Codex / Work handoff"
