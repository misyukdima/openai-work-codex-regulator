name: Publish GitHub release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Releases may only be published from main."; exit 1; }

      - name: Validate v4 repository
        run: python3 scripts/validate_repo_v4.py
      - name: Validate v4 adaptive routing
        run: python3 scripts/validate_v4_routing.py
      - name: Validate release contract
        run: python3 scripts/validate_release_contract.py
      - name: Validate Plugin package contract
        run: python3 scripts/validate_plugin_package.py

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fail closed if release or tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then exit 1; fi

      - name: Build and round-trip validate release artifact
        run: python3 scripts/package_release.py

      - name: Checksum validated artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cd dist
          sha256sum "openai-work-codex-regulator-v$VERSION.zip" > "openai-work-codex-regulator-v$VERSION.zip.sha256"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "# openai-work-codex-regulator v$VERSION"
            echo
            echo "Quota-aware ChatGPT orchestrator for Work and Codex."
            echo
            awk -v v="$VERSION" '
              $0 ~ "^## " v " " {capture=1; next}
              capture && /^## / {exit}
              capture {print}
            ' CHANGELOG.md
          } > /tmp/release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          ZIP="dist/openai-work-codex-regulator-v$VERSION.zip"
          CHECKSUM="$ZIP.sha256"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "openai-work-codex-regulator v$VERSION" --notes-file /tmp/release-notes.md "$ZIP#Portable skill archive" "$CHECKSUM#SHA-256 checksum"

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          ZIP="openai-work-codex-regulator-v$VERSION.zip"
          CHECKSUM="$ZIP.sha256"
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          grep -Fxq "$ZIP" <<<"$ASSETS"
          grep -Fxq "$CHECKSUM" <<<"$ASSETS"
          TARGET="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$TARGET" = "$GITHUB_SHA"
