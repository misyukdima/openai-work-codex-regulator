name: Validate skill repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate repository
        run: python3 scripts/validate_repo.py
      - name: Validate Plugin package contract
        run: python3 scripts/validate_plugin_package.py
      - name: Validate quota Plugin backend
        run: python3 plugin/quota_backend.py --self-test
      - name: Validate sealed auth lifecycle
        run: python3 plugin/sealed_auth_store.py
      - name: Validate authorization coordinator
        run: python3 plugin/authorization_coordinator.py
      - name: Validate auth concurrency
        run: python3 plugin/auth_concurrency.py
      - name: Validate auth recovery
        run: python3 plugin/auth_recovery.py
      - name: Validate production vault adapter
        run: python3 plugin/production_vault.py
      - name: Install pinned MCP SDK
        run: python3 -m pip install --disable-pip-version-check -r plugin/requirements-mcp.txt
      - name: Validate MCP transport
        run: python3 plugin/mcp_transport.py --self-test
