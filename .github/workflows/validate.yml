name: Validate skill repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate repository
        run: python3 scripts/validate_repo.py
      - name: Validate quota Plugin backend
        run: python3 plugin/quota_backend.py --self-test
