name: One-shot refresh repository About

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-about:
    runs-on: ubuntu-latest
    steps:
      - name: Update description and topics
        env:
          GH_TOKEN: ${{ github.token }}
          DESCRIPTION: Skill-регулятор для ChatGPT, Work и Codex: распределяет задачи, бережёт общую квоту Work/Codex и не даёт экономии останавливать рабочий процесс.
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f "description=${DESCRIPTION}" >/dev/null

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/topics" \
            -f 'names[]=ai-agents' \
            -f 'names[]=agentic-workflow' \
            -f 'names[]=chatgpt' \
            -f 'names[]=chatgpt-work' \
            -f 'names[]=codex' \
            -f 'names[]=llm-ops' \
            -f 'names[]=openai' \
            -f 'names[]=quota-management' \
            -f 'names[]=workflow-orchestration' >/dev/null

      - name: Verify About
        env:
          GH_TOKEN: ${{ github.token }}
          DESCRIPTION: Skill-регулятор для ChatGPT, Work и Codex: распределяет задачи, бережёт общую квоту Work/Codex и не даёт экономии останавливать рабочий процесс.
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_DESCRIPTION="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.description')"
          test "$ACTUAL_DESCRIPTION" = "$DESCRIPTION"

          ACTUAL_TOPICS="$(gh api "repos/${GITHUB_REPOSITORY}/topics" --jq '.names | sort | join("\n")')"
          EXPECTED_TOPICS="$(printf '%s\n' \
            ai-agents \
            agentic-workflow \
            chatgpt \
            chatgpt-work \
            codex \
            llm-ops \
            openai \
            quota-management \
            workflow-orchestration | sort)"
          test "$ACTUAL_TOPICS" = "$EXPECTED_TOPICS"
          echo "Repository About verified."
